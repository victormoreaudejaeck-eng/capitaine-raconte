}

function faceTex(mood, beard){
  const key = mood + beard; if (FACES[key]) return FACES[key];

    for (const ex of [82, 174]){
      c.fillStyle = '#fff'; c.beginPath(); c.ellipse(ex, 118, eyeR, mood === 'tired' ? 10 : eyeR, 0, 0, 7); c.fill();

      c.fillStyle = '#1b1a2e'; c.beginPath(); c.arc(ex + 3, 120, mood === 'tired' ? 6 : 9, 0, 7); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(ex + 7, 114, 3, 0, 7); c.fill();
    }
    c.strokeStyle = '#1b1a2e'; c.lineWidth = 10; c.lineCap = 'round';
    const by = mood === 'scared' ? 66 : 80, tilt = mood === 'scared' ? -10 : mood === 'tired' ? 8 : 0;
    c.beginPath(); c.moveTo(50, by + tilt); c.lineTo(110, by); c.moveTo(146, by); c.lineTo(206, by + tilt); c.stroke();
    if (beard){ c.fillStyle = '#b9b4ab'; c.beginPath(); c.moveTo(30, 150); c.quadraticCurveTo(128, 300, 226, 150); c.lineTo(226, 256); c.lineTo(30, 256); c.fill(); }
    c.fillStyle = '#5a1e24'; c.strokeStyle = '#1b1a2e'; c.lineWidth = 6;
    if (mood === 'scared'){ c.beginPath(); c.ellipse(128, 196, 18, 24, 0, 0, 7); c.fill(); c.stroke(); }
    else if (mood === 'happy'){ c.beginPath(); c.arc(128, 178, 34, .2, Math.PI - .2); c.fill(); c.stroke(); }
    else if (mood === 'tired'){ c.beginPath(); c.moveTo(100, 200); c.quadraticCurveTo(128, 186, 156, 200); c.stroke(); }
    else { c.beginPath(); c.moveTo(102, 192); c.lineTo(154, 192); c.stroke(); }
  });
}

function look(name){
  const L = LOOKS[name];
  skyUniforms.top.value.set(L.top); skyUniforms.bot.value.set(L.bot);
  scene.fog = new THREE.Fog(L.fog, L.fogD[0], L.fogD[1]);
  hemi.color.set(L.hemi[0]); hemi.groundColor.set(L.hemi[1]); hemi.intensity = L.hemi[2];
  sun.color.set(L.sun[0]); sun.intensity = L.sun[1]; oceanMat.color.set(L.sea);
  renderer.toneMappingExposure = L.exp; scene.background = new THREE.Color(L.bot);
  flash.intensity = 0; lamp.intensity = 0;
}
function cam(px, py, pz, tx, ty, tz, fov = 40, roll = 0){
  camera.position.set(px, py, pz); camera.fov = fov; camera.updateProjectionMatrix(); camera.lookAt(tx, ty, tz);
  if (roll) camera.rotateZ(roll);
}
function shake(amt, t){ camera.position.x += Math.sin(t*37)*amt; camera.position.y += Math.cos(t*29)*amt*.7; }
function floatOn(obj, x, z, t, k = 1){
  const y = waveH(x, z, t); const dx = waveH(x + 2, z, t) - waveH(x - 2, z, t); const dz = waveH(x, z + 3, t) - waveH(x, z - 3, t);
  obj.position.set(x, y, z); obj.rotation.z = -dx * .12 * k; obj.rotation.x = dz * .08 * k;
}
function placeBoatParts(b, {keelBroken = 0} = {}){
  const k = b.userData.keel; k.position.set(0, -keelBroken*8, -keelBroken*2); k.rotation.x = keelBroken * 1.2;
}
function updatePocketWater(t, level){
  const p = pWaterGeo.attributes.position.array;
  for (let i = 0; i < p.length; i += 3) p[i+1] = level + Math.sin(pWaterBase[i]*1.3 + t*2.2)*.08 + Math.sin(pWaterBase[i+2]*.9 - t*1.7)*.1;
  pWaterGeo.attributes.position.needsUpdate = true; pWaterGeo.computeVertexNormals();
}
function bubblesAt(cx, cy, cz, t, spread = 1){
  bubbles.position.set(cx, cy, cz);
  for (const b of bubbles.children){ const u = b.userData; const a = ((t*.4*u.s + u.ph) % 1); b.position.set(u.x*spread + Math.sin(t*3+u.ph*9)*.2, a*10, u.z*spread); b.material.opacity = .55*(1-a); }
}
function posePocket(t, {mood = 'scared', level = 0, torchOn = true, shiver = 0} = {}){
  setMood(tony, mood);
  tony.position.set(0, level - 2.3 + Math.sin(t*1.3)*.06, 0); tony.rotation.set(0, Math.sin(t*.4)*.15, 0);
  tony.position.x += Math.sin(t*40)*.03*shiver;
  tony.userData.armR.rotation.x = -1.1; tony.userData.armL.rotation.x = -.2 + Math.sin(t*2)*.05;
  const hand = new THREE.Vector3(.95, 1.4, .9).applyMatrix4(new THREE.Matrix4().makeRotationY(tony.rotation.y)).add(tony.position);
  torch.position.copy(hand); flash.position.copy(hand);
  const aim = new THREE.Vector3(Math.sin(t*.7)*2.5, level + 1.6 + Math.sin(t*.9)*.6, 6);
  flash.target.position.copy(aim); torch.lookAt(aim); beam.position.copy(hand); beam.lookAt(aim);
  flash.intensity = torchOn ? 420 : 0; beam.visible = torchOn;
  lamp.color.set(0xffa860); lamp.intensity = torchOn ? 9 : 2; lamp.position.copy(tony.position).add(new THREE.Vector3(.6, 3.3, 1.6));
  updatePocketWater(t, level);
  for (const [i, r] of pocket.userData.ropes.entries()) r.rotation.z = Math.sin(t*1.2 + i)*.15;
}
function resetChar(ch){ for (const k of ['armL', 'armR', 'legL', 'legR']) ch.userData[k].rotation.set(0, 0, 0); ch.rotation.set(0, 0, 0); ch.scale.setScalar(1); }

function drawRoute(p){
  if (routeLine) { scene.remove(routeLine); routeLine.geometry.dispose(); }
  const pts = []; const N = Math.max(2, Math.round(60 * p));
  for (let i = 0; i < N; i++){ const a = i / 59; pts.push(new THREE.Vector3(lerp(-4.5, 1.2, a), .03, lerp(5.5, 3.5, a) + Math.sin(a*3)*.3)); }
  routeLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), routeMat); routeLine.computeLineDistances(); scene.add(routeLine);
  ALL.includes(routeLine) || null; routeLine.visible = true;
}

// ---------- 2D overlay (captions, grade, titles) ----------
function strokeText(txt, x, y, size, fill, lw = 14, font = '900'){
  octx.font = `${font} ${size}px "Inter", "DejaVu Sans", sans-serif`; octx.textAlign = 'center'; octx.textBaseline = 'middle';
  octx.lineJoin = 'round'; octx.strokeStyle = '#000'; octx.lineWidth = lw; octx.strokeText(txt, x, y); octx.fillStyle = fill; octx.fillText(txt, x, y);
}
let DATA = null;
window.setData = d => {
  const find = (arr, t) => { for (const x of arr) if (t >= x.start && t < x.start + x.dur) return x; return null; };
  DATA = {
    shotAt: t => find(d.shots, t) || d.shots[d.shots.length - 1],
    wordAt: t => { for (const w of d.words) if (t >= w.start && t < w.end) return w; return null; },
    chipAt: t => { const c = find(d.chips, t); return c ? c.text : null; },
  };
};
function overlay(t, shot, fx, lt, sd){
  // vignette + grain = cinematic grade
  const v = octx.createRadialGradient(W/2, H/2, 500, W/2, H/2, 1250); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)');
  octx.fillStyle = v; octx.fillRect(0, 0, W, H);
  if (fx.dark) { octx.fillStyle = `rgba(0,0,0,${fx.dark})`; octx.fillRect(0, 0, W, H); }
  if (fx.lightning) { octx.fillStyle = 'rgba(220,235,255,.55)'; octx.fillRect(0, 0, W, H); }
  if (fx.flashW) { octx.fillStyle = 'rgba(255,255,255,.7)'; octx.fillRect(0, 0, W, H); }
  if (fx.cold) { const g = octx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(120,180,255,.18)'); g.addColorStop(1, 'rgba(120,180,255,0)'); octx.fillStyle = g; octx.fillRect(0, 0, W, H); }
  if (fx.breath){ for (let i = 0; i < 6; i++){ const a = ((t*.5 + i/6) % 1); octx.fillStyle = `rgba(230,240,255,${.25*(1-a)})`; octx.beginPath(); octx.arc(560 + a*160, 820 - a*120, 30 + a*90, 0, 7); octx.fill(); } }
  if (fx.scope){ octx.strokeStyle = 'rgba(160,255,160,.75)'; octx.lineWidth = 4; octx.beginPath(); octx.arc(W/2, H/2, 330, 0, 7); octx.stroke();
    octx.beginPath(); octx.moveTo(W/2 - 380, H/2); octx.lineTo(W/2 + 380, H/2); octx.moveTo(W/2, H/2 - 380); octx.lineTo(W/2, H/2 + 380); octx.stroke();
    octx.font = '700 34px monospace'; octx.fillStyle = 'rgba(160,255,160,.9)'; octx.textAlign = 'left'; octx.fillText('RAAF  ORION  —  CONTACT', 120, 330); }
  if (fx.knock){ const s = 1 + Math.max(0, Math.sin(t*14))*.15; octx.save(); octx.translate(W/2, 640); octx.scale(s, s); octx.rotate(-.05); strokeText(fx.knock, 0, 0, 120, '#ffffff', 18); octx.restore(); }
  if (fx.days){ const day = 1 + Math.floor(clamp(lt/sd, 0, .999) * 4); strokeText('JOUR ' + day, W/2, 380, 150, '#ff5a4d', 20); }
  if (fx.title){ const s = easeOut(clamp(lt/.5, 0, 1)); octx.save(); octx.translate(W/2, 820); octx.scale(s, s);
    strokeText('4 JOURS', 0, -110, 190, '#ffe14d', 26); strokeText('SOUS LA COQUE', 0, 70, 120, '#ffffff', 20); octx.restore(); }
  if (fx.endcard){ const s = easeOut(clamp((lt - .3)/.5, 0, 1)); if (s > 0){ octx.save(); octx.translate(W/2, 700); octx.scale(s, s);
    octx.fillStyle = '#e63946'; octx.beginPath(); octx.roundRect(-400, -110, 800, 220, 60); octx.fill(); octx.lineWidth = 8; octx.strokeStyle = '#000'; octx.stroke();
    strokeText('ABONNE-TOI', 0, -20, 96, '#fff', 12); strokeText('pour la prochaine histoire', 0, 60, 44, '#ffe9a8', 8, '800'); octx.restore(); } }
  // chip (top info pill)
  if (DATA && DATA.chipAt){ const ch = DATA.chipAt(t); if (ch){ octx.font = '900 54px "Inter", sans-serif'; const w = octx.measureText(ch).width + 80;
    octx.fillStyle = 'rgba(10,12,20,.75)'; octx.beginPath(); octx.roundRect(W/2 - w/2, 170, w, 96, 48); octx.fill(); octx.strokeStyle = '#ffe14d'; octx.lineWidth = 5; octx.stroke();
    octx.fillStyle = '#ffe14d'; octx.textAlign = 'center'; octx.textBaseline = 'middle'; octx.fillText(ch, W/2, 220); } }
  // single-word caption (the viral style)
  if (DATA){ const w = DATA.wordAt(t); if (w){ const age = t - w.start; const s = age < .08 ? .7 + age/.08*.38 : 1.08 - Math.min(.08, (age - .08)*.6);
    octx.font = '900 118px "Inter", sans-serif'; const fit = Math.min(1, 940 / octx.measureText(w.text).width);
    octx.save(); octx.translate(W/2, 1520); octx.scale(s * fit * .68, s * fit * .68); strokeText(w.text, 0, 0, 118, '#ffffff', 22); octx.restore(); } }
  // cut flash: 2 frames darken at each shot start for punch
  if (lt < 1/30) { octx.fillStyle = 'rgba(0,0,0,.35)'; octx.fillRect(0, 0, W, H); }
}

// ---------- frame entry point ----------
window.drawFrame = (t) => {
  const sh = DATA.shotAt(t); const lt = t - sh.start, p = clamp(lt / sh.dur, 0, 1);
  rain.visible = false; pocket.rotation.set(0, 0, 0); pocket.position.set(0, 0, 0); boat.rotation.set(0, 0, 0); resetChar(tony);
  updateOcean(t);
  sunDisc.material.color.set(0xffd27a);
  const fx = SHOTS[sh.name](t, p, sh.dur) || {};
  renderer.render(scene, camera);
  octx.drawImage(renderer.domElement, 0, 0);
  overlay(t, sh, fx, lt, sh.dur);
};
window.grab = () => out.toDataURL('image/jpeg', .9);
window.ready = true;
</script>
