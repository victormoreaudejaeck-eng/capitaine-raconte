function loftHull(){
  // stations [z, halfBeam, draftBelowWL, freeboardAboveWL]  — waterline is y = 0
  const st = [[-9.2, 2.3, .55, 1.25], [-7, 2.7, .7, 1.3], [-3, 2.85, .8, 1.35], [1, 2.75, .78, 1.42], [5, 2.15, .65, 1.55], [8, 1.0, .45, 1.7], [9.6, .06, .2, 1.8]];
  const sample = z => { for (let i = 0; i < st.length - 1; i++){ const a = st[i], c = st[i+1]; if (z <= c[0]){ const p = (z - a[0]) / (c[0] - a[0]), s = p*p*(3-2*p); return a.map((v, k) => v + (c[k] - v) * (k === 0 ? p : s)); } } return st[st.length-1]; };
  // section profile: deck edge -> straight topside -> soft chine -> flat-ish bottom to centreline (and mirrored)
  const prof = (hb, dr, fb) => { const pts = [];
    const half = [[hb * .96, fb], [hb, fb * .55], [hb, .15], [hb * .97, -dr * .35], [hb * .85, -dr * .75], [hb * .55, -dr * .95], [0, -dr]];
    for (const q of half) pts.push(q); for (let i = half.length - 2; i >= 0; i--) pts.push([-half[i][0], half[i][1]]); return pts; };
  const L = 48, pos = [], idx = []; let ring = 0;
  for (let j = 0; j <= L; j++){
    const z = -9.2 + 18.8 * j / L; const [, hb, dr, fb] = sample(z); const pr = prof(Math.max(hb, .02), dr, fb); ring = pr.length;
    for (const [x, y] of pr) pos.push(x, y, z);
  }
  for (let j = 0; j < L; j++) for (let i = 0; i < ring - 1; i++){ const a = j*ring+i, c = a + ring; idx.push(a, c, a+1, c, c+1, a+1); }
  // transom (stern face)
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  g.userData = {sample};
  return g;
}
function makeBoat(tint){

  const roof = new THREE.Mesh(roofG, paint); roof.position.set(0, 1.65, -1.8); roof.castShadow = true; b.add(roof);
  const glass = new THREE.Mesh(new THREE.BoxGeometry(2.62, .22, 1.6), new THREE.MeshPhysicalMaterial({color: 0x101820, roughness: .05, metalness: .2, clearcoat: 1})); glass.position.set(0, 1.8, -.6); b.add(glass);

  const line = (a, c) => { const v = new THREE.Vector3().subVectors(c, a); const m = new THREE.Mesh(new THREE.CylinderGeometry(.015, .015, v.length(), 4), carbon); m.position.copy(a).addScaledVector(v, .5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), v.clone().normalize()); b.add(m); };

  const jib = sail(new THREE.Vector3(0, 2.3, 9.2), new THREE.Vector3(0, 25.3, 1.6), new THREE.Vector3(.5, 2.3, 2.2), .8); b.add(jib);
  // sail number
  const tex = (() => { const c = document.createElement('canvas'); c.width = 512; c.height = 256; const x = c.getContext('2d'); x.font = '900 200px Inter, sans-serif'; x.fillStyle = '#c8102e'; x.textAlign = 'center'; x.fillText('GBR', 256, 200); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();

  b.userData = {keel: keelG};
  return b;
}

const pmrem = new THREE.PMREMGenerator(renderer);

function setSky(key, elev, azim, turb, ray, mie){
  const u = sky.material.uniforms; u.turbidity.value = turb; u.rayleigh.value = ray; u.mieCoefficient.value = mie; u.mieDirectionalG.value = .82;

// ---- calm / moderate sea : reflective water ----
const normals = new THREE.TextureLoader().load('/studio3d/assets/waternormals.png', t => { t.wrapS = t.wrapT = THREE.RepeatWrapping; });
const water = new Water(new THREE.PlaneGeometry(10000, 10000), {textureWidth: 1024, textureHeight: 1024, waterNormals: normals,
  sunDirection: sunDir, sunColor: 0xfff4e0, waterColor: 0x062638, distortionScale: 22, fog: true});

// ---- storm sea : displaced swell with whitecaps ----
const SG = new THREE.PlaneGeometry(700, 700, 180, 180); SG.rotateX(-Math.PI / 2);
const SGbase = SG.attributes.position.array.slice();
SG.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(SG.attributes.position.count * 3), 3));
const stormSea = new THREE.Mesh(SG, phys(0xffffff, {vertexColors: true, roughness: .16, envMapIntensity: .9})); stormSea.receiveShadow = true; scene.add(stormSea);
let SEA = 1;
function swell(x, z, t){
  return SEA * (Math.sin(x * .045 + t * .75) * 2.4 + Math.sin(z * .06 - t * .95) * 1.8 + Math.sin((x + z) * .1 + t * 1.5) * .8 + Math.sin((x - z) * .21 - t * 2.1) * .35 + Math.sin(x * .37 + z * .29 + t * 2.9) * .12);
}
const deep = new THREE.Color(0x0b2633), crest = new THREE.Color(0x3f6a7a), foamC = new THREE.Color(0xe8eef0);
function updateStormSea(t, cx, cz){
  stormSea.position.set(cx, 0, cz);
  const p = SG.attributes.position.array, c = SG.attributes.color.array, tmp = new THREE.Color();
  for (let i = 0; i < p.length; i += 3){ const h = swell(SGbase[i] + cx, SGbase[i+2] + cz, t); p[i+1] = h;
    const k = clamp((h / (SEA * 4.6) + 1) / 2, 0, 1); tmp.copy(deep).lerp(crest, k); if (k > .86) tmp.lerp(foamC, (k - .86) / .14);
    c[i] = tmp.r; c[i+1] = tmp.g; c[i+2] = tmp.b; }
  SG.attributes.position.needsUpdate = true; SG.attributes.color.needsUpdate = true; SG.computeVertexNormals();
}
function seaH(x, z, t){ return stormSea.visible ? swell(x, z, t) : Math.sin(x * .2 + t) * .08 + Math.sin(z * .15 - t * 1.2) * .08; }

// ---- rain & spray ----
const RN = 3000, rainGeo = new THREE.BufferGeometry(), rainPos = new Float32Array(RN * 6); rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rainSeed = []; { const r = rng(3); for (let i = 0; i < RN; i++) rainSeed.push([r() * 80 - 40, r() * 40, r() * 80 - 40, .6 + r() * .4]); }
const rain = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({color: 0xb8c4d0, transparent: true, opacity: .35})); scene.add(rain);
function updateRain(t, c){ for (let i = 0; i < RN; i++){ const [x, y0, z, s] = rainSeed[i]; const y = ((y0 - t * 30 * s) % 40 + 40) % 40 + c.y - 15; const X = c.x + x, Z = c.z + z; rainPos.set([X, y, Z, X - .5, y - 1.6, Z], i * 6); } rainGeo.attributes.position.needsUpdate = true; }

const fleet = []; { const cols = [0x2a7de1, 0xf2a900, 0x1faa59, 0x101418, 0xe8590c]; for (const c of cols){ const b = makeBoat(c); fleet.push(b); scene.add(b); } }

// ================= PEOPLE (realistic proportions, ~1.8 m) =================
const FACE = {};
function faceTex(m, beard, brow = '#4a4038', hair = '#8f8a82'){
  const key = m + beard + brow + hair; if (FACE[key]) return FACE[key];
  return FACE[key] = canvasTex(1024, 512, (c) => {
    const cx = 256, cy = 248; const g = c.createLinearGradient(0, 0, 0, 512); g.addColorStop(0, '#e6b693'); g.addColorStop(1, '#d39d79'); c.fillStyle = g; c.fillRect(0, 0, 1024, 512);
    // painted short hair: hairline on the forehead, lower at the back (front centre = x 256, back centre = x 768)
    const hairAt = x => { const d = Math.min(Math.abs(x - 256), 1024 - Math.abs(x - 256)) / 512; return 150 + Math.pow(d, 1.6) * 175; };
    c.fillStyle = hair; c.beginPath(); c.moveTo(0, 0); for (let x = 0; x <= 1024; x += 8) c.lineTo(x, hairAt(x) + Math.sin(x * .7) * 3); c.lineTo(1024, 0); c.closePath(); c.fill();
    for (let i = 0; i < 9000; i++){ const x = Math.random() * 1024, y = Math.random() * hairAt(x); c.fillStyle = `rgba(${Math.random() < .5 ? '255,255,255' : '0,0,0'},${Math.random() * .13})`; c.fillRect(x, y, 1.5, 5); }
    c.fillStyle = 'rgba(205,110,95,.28)'; c.beginPath(); c.ellipse(cx - 70, cy + 52, 26, 16, 0, 0, 7); c.ellipse(cx + 70, cy + 52, 26, 16, 0, 0, 7); c.fill();
    const scared = m === 'scared', tired = m === 'tired', happy = m === 'happy';
    for (const sx of [-1, 1]){ const ex = cx + sx * 50, ey = cy;
      const ry = scared ? 17 : tired ? 7 : happy ? 10 : 13, rx = scared ? 19 : 17;
      c.fillStyle = '#f7f3ec'; c.beginPath(); c.ellipse(ex, ey, rx, ry, 0, 0, 7); c.fill(); c.strokeStyle = 'rgba(60,35,25,.8)'; c.lineWidth = 3.5; c.stroke();
      c.save(); c.beginPath(); c.ellipse(ex, ey, rx, ry, 0, 0, 7); c.clip();
      c.fillStyle = '#5b3a22'; c.beginPath(); c.arc(ex + sx * 2, ey + 1, 9.5, 0, 7); c.fill(); c.fillStyle = '#120a06'; c.beginPath(); c.arc(ex + sx * 2, ey + 1, 4.8, 0, 7); c.fill();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(ex + sx * 2 + 4, ey - 3, 2.6, 0, 7); c.fill(); c.restore();
      if (tired){ c.fillStyle = 'rgba(160,100,80,.45)'; c.beginPath(); c.ellipse(ex, ey + 12, 16, 5, 0, 0, 7); c.fill(); }
      c.strokeStyle = brow; c.lineWidth = 9; c.lineCap = 'round'; const by = ey - (scared ? 36 : 28), tilt = scared ? 9 : tired ? -7 : happy ? 3 : 0;
      c.beginPath(); c.moveTo(ex - sx * 20, by + (sx < 0 ? -tilt : -tilt) * -1 * 0 + (scared ? tilt : -tilt) * (sx < 0 ? 1 : 1) * 0 + (scared || tired ? tilt * (sx < 0 ? -1 : -1) : 0)); c.quadraticCurveTo(ex, by - 5, ex + sx * 20, by + (scared ? -tilt : tired ? -tilt : 0) * -1); c.stroke(); }

    else if (happy){ c.beginPath(); c.moveTo(cx - 34, my - 6); c.quadraticCurveTo(cx, my + 34, cx + 34, my - 6); c.closePath(); c.fill(); c.stroke(); c.fillStyle = '#f2ede4'; c.fillRect(cx - 22, my - 5, 44, 8); }
    else if (tired){ c.beginPath(); c.moveTo(cx - 24, my + 8); c.quadraticCurveTo(cx, my - 4, cx + 24, my + 8); c.stroke(); }
    else { c.beginPath(); c.moveTo(cx - 22, my); c.quadraticCurveTo(cx, my + 4, cx + 22, my); c.stroke(); }
    if (beard){ c.fillStyle = '#b9b3a8'; c.beginPath(); c.moveTo(cx - 105, cy + 30); c.quadraticCurveTo(cx - 100, cy + 175, cx, cy + 200); c.quadraticCurveTo(cx + 100, cy + 175, cx + 105, cy + 30);
      c.quadraticCurveTo(cx + 60, cy + 70, cx + 40, my - 14); c.quadraticCurveTo(cx, my - 26, cx - 40, my - 14); c.quadraticCurveTo(cx - 60, cy + 70, cx - 105, cy + 30); c.fill();
      for (let i = 0; i < 500; i++){ const a = Math.random() * Math.PI, r = 60 + Math.random() * 110; c.fillStyle = `rgba(${Math.random() < .5 ? '235,232,226' : '150,145,138'},.22)`; c.fillRect(cx + Math.cos(a) * r * .9, cy + 40 + Math.sin(a) * r * .9, 2, 5); }
      // keep the mouth visible through the beard
      c.fillStyle = '#5a2224'; if (scared){ c.beginPath(); c.ellipse(cx, my + 4, 16, 20, 0, 0, 7); c.fill(); } else if (happy){ c.beginPath(); c.moveTo(cx - 34, my - 6); c.quadraticCurveTo(cx, my + 34, cx + 34, my - 6); c.closePath(); c.fill(); }
      else { c.strokeStyle = '#5a2224'; c.lineWidth = 6; c.beginPath(); c.moveTo(cx - 22, my + 2); c.quadraticCurveTo(cx, my + (tired ? -6 : 5), cx + 22, my + 2); c.stroke(); } }
  });
}
function capsule(r, len, m){ const g = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 6, 14), m); g.castShadow = true; g.receiveShadow = true; return g; }
function makePerson(o = {}){
  const P = new THREE.Group(); const skin = std(0xe0ac88, {roughness: .55});
  const jacket = phys(o.jacket ?? 0xf2b705, {roughness: .45, clearcoat: .4}), pants = std(o.pants ?? 0x23262e, {roughness: .8}), boots = std(0x15161a, {roughness: .5});

  const pelvis = capsule(.16, .12, pants); pelvis.rotation.z = Math.PI / 2; hips.add(pelvis);
  const legs = [];
  for (const sx of [-1, 1]){ const hip = new THREE.Group(); hip.position.set(sx * .11, -.02, 0); hips.add(hip);
    const thigh = capsule(.085, .34, pants); thigh.position.y = -.22; hip.add(thigh);
    const knee = new THREE.Group(); knee.position.y = -.46; hip.add(knee);
    const shin = capsule(.07, .34, pants); shin.position.y = -.22; knee.add(shin);
    const boot = new THREE.Mesh(new THREE.BoxGeometry(.12, .1, .26), boots); boot.position.set(0, -.45, .05); boot.castShadow = true; knee.add(boot);
    legs.push({hip, knee}); }
  const spine = new THREE.Group(); spine.position.y = .08; hips.add(spine);
  const torso = capsule(.2, .3, jacket); torso.scale.set(1.12, 1, .72); torso.position.y = .3; spine.add(torso);
  const refl = std(0xc9ced4, {roughness: .3, metalness: .6});
  const band = new THREE.Mesh(new THREE.CylinderGeometry(.226, .226, .035, 24, 1, true), refl); band.scale.set(1.0, 1, .73); band.position.y = .16; spine.add(band);

  mc_theory_evac(t, p){ look('grey'); only(sky, water, brig, yawlFree, captain, sarah, sophia, crew[0], crew[1]); water.material.uniforms.time.value = t * .5; mcSail(t, 0); brig.userData.yawl.visible = false;
    floatBoat(yawlFree, -5.8, -1, t, 0, .3); yawlFree.rotation.y = 0;
    for (const q of [captain, sarah, sophia, crew[0], crew[1]]){ rest(q); mood(q, 'scared'); }
    onDeck(captain, -2.6, -2); captain.rotation.y = -Math.PI / 2; captain.userData.arms[1].sh.rotation.set(-1.6, 0, -.2); captain.userData.neck.rotation.y = .4;
    sarah.position.set(-5.8, yawlFree.position.y + .05, -.2); sarah.rotation.y = Math.PI / 2; sophia.position.set(-5.8, yawlFree.position.y + .05, -1.0); sophia.rotation.y = Math.PI / 2;
    crew[0].position.set(-5.8, yawlFree.position.y + .05, -2.0); crew[0].rotation.y = Math.PI / 2; seat(crew[0]); crew[0].position.y -= .35;
    onDeck(crew[1], -3.1, -.5); crew[1].rotation.y = -Math.PI / 2; crew[1].userData.arms.forEach(a => a.sh.rotation.x = -.9);
    cam(V(-17, 4.5, 6), V(-4, 2, -1), 38); sunFollow(V(0, 0, 0)); return {}; },
  mc_lifeboat_alone_sea(t, p){ look('grey'); only(sky, water, yawlFree, captain, sarah, crew[0], crew[1], crew[2]); water.material.uniforms.time.value = t * .55;
    floatBoat(yawlFree, 0, t * .6, t, 0, .8); yawlFree.rotation.y = 0; const yb = yawlFree.position;
    [[captain, 0, -1.5], [sarah, .3, -.4], [crew[0], -.35, .4], [crew[1], .35, 1.1], [crew[2], -.3, 1.8]].forEach(([q, x, z], i) => { rest(q); mood(q, 'tired'); q.position.set(x, yb.y - .3, yb.z + z); q.rotation.y = Math.PI; seat(q);
      if (i > 1) q.userData.arms.forEach(a => { a.sh.rotation.x = -1.2 + Math.sin(t * 2.4) * .5; }); });
    cam(V(9 - p * 3, 5 + p * 10, yb.z + 14), V(0, 0, yb.z), 40); sunFollow(yb); scene.fog = new THREE.Fog(0xb9c3cb, 40, 600); return {}; },
  mc_lifeboat_far(t, p){ look('grey'); only(sky, water, yawlFree, brig); water.material.uniforms.time.value = t * .55; floatBoat(yawlFree, 0, 0, t, 0, .8); mcDrift(t);

// ================= 2D OVERLAY =================
function strokeText(txt, x, y, size, fill, lw = 14, font = '900'){
  octx.font = `${font} ${size}px "Inter", "DejaVu Sans", sans-serif`; octx.textAlign = 'center'; octx.textBaseline = 'middle';
  octx.lineJoin = 'round'; octx.strokeStyle = '#000'; octx.lineWidth = lw; octx.strokeText(txt, x, y); octx.fillStyle = fill; octx.fillText(txt, x, y);
}
let DATA = null;
window.setData = d => { const find = (arr, t) => { for (const x of arr) if (t >= x.start && t < x.start + x.dur) return x; return null; };
  DATA = { title1: d.title1 || '', title2: d.title2 || '', shotAt: t => find(d.shots, t) || d.shots[d.shots.length - 1], wordAt: t => { for (const w of d.words) if (t >= w.start && t < w.end) return w; return null; }, chipAt: t => { const c = find(d.chips, t); return c ? c.text : null; } }; };
function overlay(t, fx, lt, sd){
  const v = octx.createRadialGradient(W/2, H/2, 600, W/2, H/2, 1300); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.35)'); octx.fillStyle = v; octx.fillRect(0, 0, W, H);
  if (fx.dark){ octx.fillStyle = `rgba(0,0,0,${fx.dark})`; octx.fillRect(0, 0, W, H); }
  if (fx.lightning){ octx.fillStyle = 'rgba(220,235,255,.45)'; octx.fillRect(0, 0, W, H); }
  if (fx.flashW){ octx.fillStyle = 'rgba(255,255,255,.6)'; octx.fillRect(0, 0, W, H); }
  if (fx.cold){ const g = octx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(120,180,255,.14)'); g.addColorStop(1, 'rgba(120,180,255,0)'); octx.fillStyle = g; octx.fillRect(0, 0, W, H); }
  if (fx.breath){ for (let i = 0; i < 6; i++){ const a = ((t * .5 + i / 6) % 1); octx.fillStyle = `rgba(230,240,255,${.16 * (1 - a)})`; octx.beginPath(); octx.arc(560 + a * 160, 860 - a * 120, 30 + a * 90, 0, 7); octx.fill(); } }
  if (fx.pulse){ for (let i = 0; i < 3; i++){ const a = ((t * .8 + i / 3) % 1); octx.strokeStyle = `rgba(255,60,60,${1 - a})`; octx.lineWidth = 6; octx.beginPath(); octx.arc(W/2, 860, 40 + a * 420, 0, 7); octx.stroke(); } }
  if (fx.scope){ octx.strokeStyle = 'rgba(170,255,170,.7)'; octx.lineWidth = 3; octx.beginPath(); octx.arc(W/2, H/2, 330, 0, 7); octx.stroke(); octx.beginPath(); octx.moveTo(W/2 - 380, H/2); octx.lineTo(W/2 + 380, H/2); octx.moveTo(W/2, H/2 - 380); octx.lineTo(W/2, H/2 + 380); octx.stroke();
    octx.font = '700 32px monospace'; octx.fillStyle = 'rgba(170,255,170,.9)'; octx.textAlign = 'left'; octx.fillText('RAAF ORION — CONTACT', 120, 330); }
  if (fx.sepia){ octx.fillStyle = 'rgba(112,72,30,.22)'; octx.fillRect(0, 0, W, H); }
  if (fx.spyglass){ octx.save(); octx.fillStyle = '#000'; octx.beginPath(); octx.rect(0, 0, W, H); octx.arc(W/2, 880, 430, 0, Math.PI * 2, true); octx.fill('evenodd');
    const g = octx.createRadialGradient(W/2, 880, 330, W/2, 880, 430); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.9)'); octx.fillStyle = g; octx.beginPath(); octx.arc(W/2, 880, 430, 0, 7); octx.fill(); octx.restore(); }
  if (fx.knock){ const s = 1 + Math.max(0, Math.sin(t * 14)) * .12; octx.save(); octx.translate(W/2, 640); octx.scale(s, s); strokeText(fx.knock, 0, 0, 104, '#ffffff', 16); octx.restore(); }
  if (fx.days){ const day = 1 + Math.floor(clamp(lt / sd, 0, .999) * 4); strokeText('JOUR ' + day, W/2, 380, 130, '#ff5a4d', 18); }
  if (fx.title){ const s = easeOut(clamp(lt / .5, 0, 1)); octx.save(); octx.translate(W/2, 820); octx.scale(s, s); const fitSize = (txt, base) => { octx.font = `900 ${base}px "Inter", sans-serif`; return Math.min(base, base * 960 / octx.measureText(txt).width); };
    strokeText(DATA.title1, 0, -110, fitSize(DATA.title1, 180), '#ffffff', 24); strokeText(DATA.title2, 0, 60, fitSize(DATA.title2, 110), '#ffe14d', 18); octx.restore(); }
  if (fx.endcard){ const s = easeOut(clamp((lt - .3) / .5, 0, 1)); if (s > 0){ octx.save(); octx.translate(W/2, 700); octx.scale(s, s); octx.fillStyle = '#e63946'; octx.beginPath(); octx.roundRect(-400, -110, 800, 220, 60); octx.fill();
    strokeText('ABONNE-TOI', 0, -20, 96, '#fff', 10); strokeText('pour la prochaine histoire', 0, 60, 44, '#ffe9a8', 7, '800'); octx.restore(); } }
  if (DATA){ const ch = fx.chipOverride || DATA.chipAt(t); if (ch){ octx.font = '800 46px "Inter", sans-serif'; const w = octx.measureText(ch).width + 70; octx.fillStyle = 'rgba(10,12,20,.6)'; octx.beginPath(); octx.roundRect(W/2 - w/2, 180, w, 84, 42); octx.fill();
    octx.fillStyle = '#ffffff'; octx.textAlign = 'center'; octx.textBaseline = 'middle'; octx.fillText(ch, W/2, 223); } }
  if (DATA){ const w = DATA.wordAt(t); if (w){ const age = t - w.start; const s = age < .07 ? .8 + age / .07 * .24 : 1.04 - Math.min(.04, (age - .07) * .4);
    octx.font = '900 80px "Inter", sans-serif'; const fit = Math.min(1, 900 / octx.measureText(w.text).width); octx.save(); octx.translate(W/2, 1520); octx.scale(s * fit, s * fit); strokeText(w.text, 0, 0, 80, '#ffffff', 15); octx.restore(); } }
}
window.drawFrame = (t) => {
  const sh = DATA.shotAt(t); const lt = t - sh.start, p = clamp(lt / sh.dur, 0, 1);
  pocket.rotation.set(0, 0, 0); pocket.position.set(0, 0, 0); boat.rotation.set(0, 0, 0); boat.traverse(o => { if (o.material === sailMat) o.visible = true; }); fill.distance = 6; sky.visible = true; fill.color.set(0xffa860);
  if (typeof brig !== 'undefined') brig.userData.yawl.visible = true;
  const fx = SHOTS[sh.name](t, p, sh.dur) || {};
  [tony, sailorA, sailorB].forEach((pp, i) => { if (!pp.visible) return; const u = pp.userData; u.spine.rotation.x += Math.sin(t * 1.7 + i) * .025; u.neck.rotation.z += Math.sin(t * .9 + i * 2) * .035; u.neck.rotation.y += Math.sin(t * .6 + i) * .05; });
  composer.render(); octx.drawImage(renderer.domElement, 0, 0); overlay(t, fx, lt, sh.dur);
};
window.grab = () => out.toDataURL('image/jpeg', .9);
window.ready = true;
