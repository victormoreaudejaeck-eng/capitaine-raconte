<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}</style></head><body>
<canvas id="c" width="2560" height="1440"></canvas>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
const W = 2560, H = 1440, INK = '#1b1a2e';
// YouTube safe area (visible on every device): 1546 x 423, centred
const SAFE = {x: (W-1546)/2, y: (H-423)/2, w: 1546, h: 423};
let seed = 7; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function sketch(path, fill, lw = 9, stroke = INK){
  if (fill){ x.beginPath(); path(); x.fillStyle = fill; x.fill(); }
  x.strokeStyle = stroke; x.lineJoin = 'round'; x.lineCap = 'round';
  for (let k = 0; k < 2; k++){
    x.save(); x.translate((r()-.5)*4, (r()-.5)*4); x.lineWidth = k ? lw*.45 : lw; x.globalAlpha = k ? .55 : 1;
    x.beginPath(); path(); x.stroke(); x.restore();
  }
}
function text(t, cx, cy, size, fill, lw, font='900', family='"Inter", sans-serif'){
  x.font = `${font} ${size}px ${family}`; x.textAlign = 'center'; x.textBaseline = 'middle';
  if (lw){ x.lineJoin = 'round'; x.strokeStyle = INK; x.lineWidth = lw; x.strokeText(t, cx, cy); }
  x.fillStyle = fill; x.fillText(t, cx, cy);
}
// sky
const g = x.createLinearGradient(0, 0, 0, H);
g.addColorStop(0, '#0b1033'); g.addColorStop(.55, '#1d2a6b'); g.addColorStop(.75, '#3a4f9a');
x.fillStyle = g; x.fillRect(0, 0, W, H);
for (let i = 0; i < 260; i++){ x.globalAlpha = .35 + r()*.65; x.fillStyle = '#fff3c4'; x.beginPath(); x.arc(r()*W, r()*1000, 1.5 + r()*3.5, 0, 7); x.fill(); }
x.globalAlpha = 1;
// moon
sketch(() => x.arc(2050, 330, 95, 0, 7), '#fff3b0', 7);
x.fillStyle = '#f2e08a'; x.beginPath(); x.arc(2020, 300, 18, 0, 7); x.arc(2085, 360, 12, 0, 7); x.fill();

// lighthouse (left) with sweeping beam
const lx = 360, ly = 1030;
const beam = x.createLinearGradient(lx, 0, lx + 1100, 0);
beam.addColorStop(0, 'rgba(255,230,140,.55)'); beam.addColorStop(1, 'rgba(255,230,140,0)');
x.fillStyle = beam; x.beginPath(); x.moveTo(lx, ly - 395); x.lineTo(lx + 1150, ly - 560); x.lineTo(lx + 1150, ly - 250); x.closePath(); x.fill();
sketch(() => { x.moveTo(140, 1100); x.quadraticCurveTo(360, 960, 600, 1100); x.closePath(); }, '#3b3a4a', 8); // rock
sketch(() => { x.moveTo(lx-70, 1040); x.lineTo(lx-45, ly-340); x.lineTo(lx+45, ly-340); x.lineTo(lx+70, 1040); x.closePath(); }, '#f4ead5', 9);
for (const [y0, y1] of [[ly-260, ly-200], [ly-120, ly-60]]){
  sketch(() => { const w0 = 45 + (1040 - y0)/(1040-(ly-340))*0, a = (y)=> 45 + (y-(ly-340))/(1040-(ly-340))*25;
    x.moveTo(lx-a(y0), y0); x.lineTo(lx+a(y0), y0); x.lineTo(lx+a(y1), y1); x.lineTo(lx-a(y1), y1); x.closePath(); }, '#e63946', 7);
}
sketch(() => x.rect(lx-60, ly-420, 120, 80), '#ffe08a', 8);
sketch(() => { x.moveTo(lx-75, ly-420); x.lineTo(lx, ly-480); x.lineTo(lx+75, ly-420); x.closePath(); }, '#e63946', 8);
sketch(() => x.rect(lx-80, ly-345, 160, 14), '#2d2d3a', 6);

// ships on horizon (right): Titanic-like + Lusitania-like
function ship(cx, cy, s, funnel, smoke=true){
  x.save(); x.translate(cx, cy); x.scale(s, s);
  for (const fx of [-130, -55, 20, 95]){
    sketch(() => { x.moveTo(fx, -95); x.lineTo(fx+34, -95); x.lineTo(fx+44, -185); x.lineTo(fx+10, -185); x.closePath(); }, funnel, 6);
    x.fillStyle = INK; x.beginPath(); x.moveTo(fx+7,-165); x.lineTo(fx+42,-165); x.lineTo(fx+44,-185); x.lineTo(fx+10,-185); x.fill();
  }
  sketch(() => x.rect(-200, -100, 360, 30), '#fbf7ee', 6);
  sketch(() => x.rect(-215, -72, 400, 30), '#fbf7ee', 6);
  sketch(() => { x.moveTo(-280, -45); x.lineTo(285, -55); x.lineTo(255, 35); x.lineTo(-235, 35); x.quadraticCurveTo(-275, 25, -280, -45); x.closePath(); }, '#23232e', 7);
  x.fillStyle = '#c0392b'; x.fillRect(-245, 12, 495, 18);
  for (let i = -240; i < 250; i += 24){ x.fillStyle = 'rgba(255,214,90,.95)'; x.beginPath(); x.arc(i, -20, 5, 0, 7); x.fill(); }
  // smoke
  if (smoke) for (let i = 0; i < 4; i++){ x.globalAlpha = .7 - i*.15; sketch(() => x.arc(60 + i*85, -230 - i*50, 24 + i*12, 0, 7), '#c9cbd6', 5); }
  x.globalAlpha = 1; x.restore();
}
ship(2160, 1035, 0.9, '#f0a43a');
ship(1680, 1050, 0.45, '#c8402e', false);

// sea
const waves = [['#3567b8', 1040, 30], ['#2a5fb0', 1130, 36], ['#1e4a92', 1250, 40], ['#163a78', 1370, 44]];
for (const [col, y0, amp] of waves){
  sketch(() => { x.moveTo(-20, H+20); for (let X = -20; X <= W+20; X += 40) x.lineTo(X, y0 + Math.sin(X/110 + y0)*amp*.5); x.lineTo(W+20, H+20); x.closePath(); }, col, 7);
  x.strokeStyle = 'rgba(255,255,255,.5)'; x.lineWidth = 6; x.lineCap = 'round';
  for (let i = 0; i < 9; i++){ const fx = r()*W, fy = y0 + 40 + r()*40; x.beginPath(); x.moveTo(fx, fy); x.lineTo(fx + 70, fy); x.stroke(); }
}

// ---- title block inside the safe area ----
const cx = W/2, cy = H/2;
// ribbon behind tagline
x.save(); x.translate(cx, cy + 85); x.rotate(-0.01);
sketch(() => { x.moveTo(-600, -42); x.lineTo(600, -42); x.lineTo(565, 0); x.lineTo(600, 42); x.lineTo(-600, 42); x.lineTo(-565, 0); x.closePath(); }, '#e63946', 8);
text('NAUFRAGES & HISTOIRES VRAIES DE LA MER', 0, 3, 48, '#fff8e1', 0);
x.restore();
// anchor icon
x.save(); x.translate(cx, cy - 160);
sketch(() => x.ellipse(0, 0, 50, 50, 0, 0, 7), '#f5c542', 7);
x.strokeStyle = INK; x.lineWidth = 7; x.lineCap = 'round';
x.beginPath(); x.moveTo(0, -26); x.lineTo(0, 28); x.moveTo(-16, -12); x.lineTo(16, -12); x.stroke();
x.beginPath(); x.arc(0, 8, 22, .2, Math.PI - .2); x.stroke(); x.beginPath(); x.arc(0, -32, 7, 0, 7); x.stroke();
x.restore();
// main title (slightly wobbly, hand-lettered feel)
x.save(); x.translate(cx, cy - 40); x.rotate(-0.015);
text('Le Capitaine Raconte', 6, 8, 128, 'rgba(0,0,0,.35)', 0);
text('Le Capitaine Raconte', 0, 0, 128, '#f5d76e', 20);
x.restore();
// schedule line
text('EN DESSIN ANIMÉ', cx, cy + 168, 40, '#ffffff', 9, '800');

// paper grain + vignette
const img = x.getImageData(0, 0, W, H), d = img.data;
for (let i = 0; i < d.length; i += 4){ const n = (r() - .5) * 16; d[i] += n; d[i+1] += n; d[i+2] += n; }
x.putImageData(img, 0, 0);
const v = x.createRadialGradient(W/2, H/2, 700, W/2, H/2, 1600);
v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.35)');
x.fillStyle = v; x.fillRect(0, 0, W, H);
window.SAFE = SAFE;
</script></body></html>
