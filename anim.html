<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const INK = '#14142b';
const LW = 7;
let SCENES = [];
const DEFAULT_SHIP = {funnel: '#f0a43a', name: 'TITANIC'};
let SHIP = DEFAULT_SHIP;          // filled by renderer: [{id, start, dur, show, counter}]
window.setScenes = s => { SCENES = s; };

// ---------- helpers ----------
function rng(seed){ return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,p) => a + (b-a)*p;
const ease = p => p<.5 ? 2*p*p : 1 - Math.pow(-2*p+2,2)/2;
const easeOutBack = p => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2); };
function poly(pts, fill, stroke=INK, lw=LW){
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.lineJoin='round'; ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function circle(x,y,r,fill,stroke=INK,lw=LW){
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  if (fill){ ctx.fillStyle=fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.stroke(); }
}
function rrect(x,y,w,h,r,fill,stroke=INK,lw=LW){
  ctx.beginPath(); ctx.roundRect(x,y,w,h,r);
  if (fill){ ctx.fillStyle=fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lw; ctx.stroke(); }
}
function outlinedText(txt, x, y, size, fill='#fff', align='center', lw=14){
  ctx.font = `900 ${size}px "Inter", "DejaVu Sans", sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.strokeStyle = INK; ctx.lineWidth = lw;
  ctx.strokeText(txt, x, y); ctx.fillStyle = fill; ctx.fillText(txt, x, y);
}

// ---------- backgrounds ----------
const STARS = (() => { const r = rng(7); return Array.from({length:120}, () => [r()*W, r()*1050, r()*3+1.5, r()*6.28]); })();
function nightSky(t, horizon=1150, moon=false){
  const g = ctx.createLinearGradient(0,0,0,horizon);
  g.addColorStop(0,'#0b1033'); g.addColorStop(.6,'#1d2a6b'); g.addColorStop(1,'#3a4f9a');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,horizon);
  for (const [x,y,s,ph] of STARS){
    if (y > horizon-40) continue;
    ctx.globalAlpha = .5 + .5*Math.sin(t*2+ph);
    ctx.fillStyle = '#fff6c8'; ctx.beginPath(); ctx.arc(x,y,s,0,7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (!moon) return;
  circle(820, 330, 95, '#fff3b0', INK, 6);
  circle(790, 300, 18, '#f2e08a', null); circle(850, 360, 12, '#f2e08a', null); circle(845, 290, 9, '#f2e08a', null);
}
function sea(t, horizon=1150, front=false){
  const bands = front
    ? [['#2a5fb0', 0, 26, 0.8], ['#1e4a92', 120, 30, 1.1], ['#163a78', 300, 34, 1.4]]
    : [['#3567b8', 0, 14, 0.6]];
  for (const [col, dy, amp, sp] of bands){
    const y0 = horizon + dy;
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x=0; x<=W; x+=20){
      ctx.lineTo(x, y0 + Math.sin(x/90 + t*sp*2 + dy) * amp*0.5 + Math.sin(x/37 - t*sp*3)*amp*0.25);
    }
    ctx.lineTo(W, H); ctx.closePath();
    ctx.fillStyle = col; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke();
    // foam dashes
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 6; ctx.lineCap='round';
    for (let i=0;i<7;i++){
      const fx = ((i*173 + t*60*sp) % (W+200)) - 100;
      const fy = y0 + 50 + (i%3)*28;
      ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx+60, fy); ctx.stroke();
    }
  }
}

// ---------- the ship (cartoon Titanic) ----------
// local coords: origin = waterline centre, length ~840
function smoke(t, x, y, k){
  for (let i=0;i<5;i++){
    const age = ((t*0.6 + i/5 + k*0.13) % 1);
    ctx.globalAlpha = (1-age) * .8;
    circle(x - age*260, y - age*170, 18 + age*45, '#c9cbd6', INK, 5);
  }
  ctx.globalAlpha = 1;
}
function drawShipBody(t, opts={}){
  const lit = opts.lit ?? 1;
  // funnels (behind)
  const fx = [-200, -85, 30, 145];
  fx.forEach((x,i) => {
    if (opts.smoke !== false) smoke(t, x+20, -290, i);
    poly([[x,-150],[x+52,-150],[x+68,-290],[x+16,-290]], SHIP.funnel);
    poly([[x+12,-262],[x+64,-262],[x+68,-290],[x+16,-290]], INK, INK, 4);
  });
  // masts
  ctx.strokeStyle = INK; ctx.lineWidth = 8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-360,-90); ctx.lineTo(-345,-360); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(320,-90); ctx.lineTo(300,-380); ctx.stroke();
  rrect(282,-300,40,26,6,'#8b5a2b',INK,5); // crow's nest
  ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-345,-360); ctx.lineTo(300,-380); ctx.stroke();
  // superstructure
  rrect(-300,-152,560,40,6,'#fbf7ee');
  rrect(-320,-112,620,52,6,'#fbf7ee');
  // hull
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-430,-75); ctx.lineTo(440,-90); ctx.lineTo(395,55);
  ctx.lineTo(-360,55); ctx.quadraticCurveTo(-420,40,-430,-75); ctx.closePath();
  ctx.fillStyle = '#23232e'; ctx.fill();
  ctx.clip();
  ctx.fillStyle = '#c0392b'; ctx.fillRect(-500, 8, 1000, 80);
  ctx.fillStyle = '#f5d76e'; ctx.fillRect(-500,-72, 1000, 6);
  ctx.restore();
  ctx.beginPath();
  ctx.moveTo(-430,-75); ctx.lineTo(440,-90); ctx.lineTo(395,55);
  ctx.lineTo(-360,55); ctx.quadraticCurveTo(-420,40,-430,-75); ctx.closePath();
  ctx.strokeStyle = INK; ctx.lineWidth = LW; ctx.stroke();
  // portholes
  for (let row=0; row<2; row++) for (let x=-370; x<380; x+=34){
    const on = lit * (0.7 + 0.3*Math.sin(t*3 + x*0.37 + row));
    ctx.fillStyle = `rgba(255,214,90,${clamp(on,0,1)})`;
    ctx.beginPath(); ctx.arc(x, -45 + row*26, 7, 0, 7); ctx.fill();
  }
  for (let x=-290; x<290; x+=30){
    ctx.fillStyle = `rgba(255,214,90,${lit})`;
    ctx.fillRect(x, -100, 16, 20); ctx.fillRect(x+6, -142, 12, 18);
  }
  // name
  ctx.font = '900 22px "Inter", sans-serif'; ctx.fillStyle = '#f5d76e'; ctx.textAlign='left';
  ctx.textAlign='right'; ctx.fillText(SHIP.name, 410, -20);
}
function drawShip(t, x, y, s, opts={}){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  if (opts.split){
    const a = opts.split; // 0..1 split amount
    // stern half (left)
    ctx.save(); ctx.translate(-20,0); ctx.rotate(-a*0.55); ctx.translate(20, a*60);
    ctx.beginPath(); ctx.rect(-600,-600,580,1200); ctx.clip();
    drawShipBody(t, opts); ctx.restore();
    // bow half (right)
    ctx.save(); ctx.translate(20,0); ctx.rotate(a*0.6); ctx.translate(-20, a*120);
    ctx.beginPath(); ctx.rect(-20,-600,620,1200); ctx.clip();
    drawShipBody(t, {...opts, smoke:false}); ctx.restore();
  } else {
    ctx.rotate(opts.tilt || 0);
    drawShipBody(t, opts);
  }
  ctx.restore();
}

function iceberg(x, y, s){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  poly([[-220,0],[-170,-120],[-110,-150],[-60,-300],[10,-250],[60,-380],[130,-230],[190,-170],[240,0]], '#e8f6ff');
  poly([[60,-380],[130,-230],[190,-170],[240,0],[90,0],[70,-200]], '#a9d6f5', null);
  poly([[-60,-300],[10,-250],[-10,-150],[-110,-150]], '#ffffff', null);
  ctx.restore();
}

// ---------- characters ----------
function lookout(t, x, y, s, scare){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  const bob = Math.sin(t*3)*4 - scare*20;
  // body
  rrect(-90, 40+bob, 180, 230, 50, '#2c3e70');
  // buttons
  circle(0, 110+bob, 9, '#f5d76e', INK, 4); circle(0, 160+bob, 9, '#f5d76e', INK, 4);
  // head
  circle(0, -40+bob, 105, '#ffd6b0');
  // cap
  ctx.beginPath(); ctx.ellipse(0,-115+bob,110,48,0,Math.PI,0); ctx.closePath();
  ctx.fillStyle='#1b2547'; ctx.fill(); ctx.strokeStyle=INK; ctx.lineWidth=LW; ctx.stroke();
  rrect(-20,-140+bob,140,22,10,'#1b2547');
  // eyes
  const er = 20 + scare*16;
  circle(-38, -45+bob, er, '#fff'); circle(38, -45+bob, er, '#fff');
  const look = 8 + scare*4;
  circle(-38+look, -45+bob, 9, INK, null); circle(38+look, -45+bob, 9, INK, null);
  // brows
  ctx.strokeStyle = INK; ctx.lineWidth = 8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-60,-80-scare*25+bob); ctx.lineTo(-18,-75-scare*30+bob); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(18,-75-scare*30+bob); ctx.lineTo(60,-80-scare*25+bob); ctx.stroke();
  // mouth
  if (scare > .3){ ctx.beginPath(); ctx.ellipse(5, 20+bob, 22, 30*scare, 0, 0, 7); ctx.fillStyle='#7a1f2b'; ctx.fill(); ctx.lineWidth=6; ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(5, 5+bob, 28, .2, Math.PI-.2); ctx.lineWidth=7; ctx.stroke(); }
  // cheeks
  ctx.globalAlpha=.35; circle(-70, 0+bob, 16, '#ff7b7b', null); circle(75, 0+bob, 16, '#ff7b7b', null); ctx.globalAlpha=1;
  // arm pointing
  ctx.strokeStyle = INK; ctx.lineWidth = 34; ctx.beginPath(); ctx.moveTo(70,90+bob); ctx.lineTo(70+scare*120, 60-scare*120+bob); ctx.stroke();
  ctx.strokeStyle = '#2c3e70'; ctx.lineWidth = 22; ctx.stroke();
  circle(70+scare*120, 60-scare*120+bob, 22, '#ffd6b0', INK, 6);
  ctx.restore();
}
let PERSON_ID = 0;
const HAIR = ['#3b2314','#f1c27d','#1b1b2f','#a0522d','#7a7a7a'];
function person(x, y, s, col, wave, t, mood){
  // mood: 'happy' (default) | 'scared'
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  const k = (PERSON_ID++ * 3 + 1) % 5;
  rrect(-16, -10, 32, 46, 12, col, INK, 4);
  // head
  circle(0, -28, 18, '#ffd6b0', INK, 4);
  // hair / hat
  ctx.fillStyle = HAIR[k];
  if (k === 2){ rrect(-17,-56,34,12,3,INK,null); rrect(-24,-46,48,6,3,INK,null); }
  else { ctx.beginPath(); ctx.arc(0,-31,18,Math.PI*1.05,Math.PI*1.95); ctx.lineTo(10,-40); ctx.closePath(); ctx.fill(); }
  // eyes (white + pupil) — blink sometimes
  const blink = (Math.sin(t*1.7 + k*2) > 0.97);
  const ex = 6.5, ey = -29;
  if (blink){ ctx.strokeStyle=INK; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(-ex-4,ey); ctx.lineTo(-ex+4,ey); ctx.moveTo(ex-4,ey); ctx.lineTo(ex+4,ey); ctx.stroke(); }
  else {
    const er = mood==='scared' ? 5.5 : 4.5;
    circle(-ex, ey, er, '#fff', INK, 1.8); circle(ex, ey, er, '#fff', INK, 1.8);
    circle(-ex+1, ey+0.5, 2.2, INK, null); circle(ex+1, ey+0.5, 2.2, INK, null);
  }
  // mouth
  ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.lineCap='round';
  if (mood === 'scared'){ ctx.beginPath(); ctx.ellipse(0,-17,3.5,4.5,0,0,7); ctx.fillStyle='#7a1f2b'; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-10,-38); ctx.lineTo(-4,-36); ctx.moveTo(10,-38); ctx.lineTo(4,-36); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(0,-21,6,0.25,Math.PI-0.25); ctx.stroke(); }
  // cheeks
  ctx.globalAlpha=.35; circle(-11,-21,3.5,'#ff7b7b',null); circle(11,-21,3.5,'#ff7b7b',null); ctx.globalAlpha=1;
  // arm
  ctx.strokeStyle = INK; ctx.lineWidth = 6;
  const a = wave ? Math.sin(t*8)*0.6 - 1.2 : 0.6;
  ctx.beginPath(); ctx.moveTo(12,0); ctx.lineTo(12+Math.cos(a)*28, Math.sin(a)*28); ctx.stroke();
  ctx.restore();
}
let LIFEBOAT_MOOD = 'scared';
function lifeboat(t, x, y, s, n, k){
  ctx.save(); ctx.translate(x, y + Math.sin(t*2+k)*10); ctx.rotate(Math.sin(t*1.5+k)*0.05); ctx.scale(s,s);
  const cols = ['#e74c3c','#f39c12','#9b59b6','#27ae60','#ecf0f1'];
  for (let i=0;i<n;i++) person(-70 + i*35, -40, 1, cols[(i+k)%5], i%2==0, t+k, LIFEBOAT_MOOD);
  poly([[-120,-30],[120,-30],[90,30],[-90,30]], '#f4f1e6');
  ctx.fillStyle = '#c0392b'; ctx.fillRect(-104,-8,208,8);
  // oars
  ctx.strokeStyle = '#8b5a2b'; ctx.lineWidth = 8;
  const oa = Math.sin(t*3+k)*0.4;
  ctx.beginPath(); ctx.moveTo(-60,-10); ctx.lineTo(-60-Math.cos(oa)*90, 40+Math.sin(oa)*20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(60,-10); ctx.lineTo(60+Math.cos(oa)*90, 40+Math.sin(oa)*20); ctx.stroke();
  ctx.restore();
}
function bubble(text, x, y, w, h, p){
  const s = easeOutBack(clamp(p,0,1));
  if (s <= 0) return;
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  rrect(-w/2,-h/2,w,h,40,'#fff');
  poly([[-40,h/2-4],[0,h/2-4],[-70,h/2+70]], '#fff');
  ctx.fillStyle='#fff'; ctx.fillRect(-42,h/2-12,46,12);
  outlinedText(text, 0, 0, 74, '#e63946', 'center', 10);
  ctx.restore();
}
function burst(x, y, r, p, text){
  if (p<=0 || p>1) return;
  const s = easeOutBack(clamp(p*3,0,1)) * (1 - Math.max(0,p-.7)/.3*0.2);
  ctx.save(); ctx.translate(x,y); ctx.rotate(-0.15); ctx.scale(s,s);
  const pts = [];
  for (let i=0;i<24;i++){ const a = i/24*Math.PI*2, rr = i%2 ? r*0.62 : r; pts.push([Math.cos(a)*rr, Math.sin(a)*rr]); }
  poly(pts, '#ffd23f');
  outlinedText(text, 0, 0, 120, '#e63946', 'center', 14);
  ctx.restore();
}


function cloud(x, y, s){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.beginPath(); ctx.arc(-60,10,45,0,7); ctx.arc(0,-15,60,0,7); ctx.arc(65,10,45,0,7); ctx.rect(-60,10,125,45);
  ctx.fillStyle='rgba(255,255,255,.95)'; ctx.fill();
  ctx.restore();
}
function flares(t){
  for (let k=0;k<2;k++){
    const cyc = 4.5, a = ((t + k*2.2) % cyc) / cyc;
    const x = 300 + k*480;
    if (a < .35){ const y = lerp(1100, 380, a/.35); ctx.strokeStyle='#fff3c4'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y+90); ctx.stroke(); }
    else { const b = (a-.35)/.65; ctx.globalAlpha = 1-b;
      for (let i=0;i<14;i++){ const an=i/14*6.28; circle(x+Math.cos(an)*b*180, 380+Math.sin(an)*b*180 + b*b*120, 9, '#fffbe0', null); }
      ctx.globalAlpha = 1; }
  }
}
function musician(t, x, y, s, ins, k){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  const bob = Math.sin(t*4+k)*2;
  rrect(-22,-60+bob,44,70,14,'#1b1b2f',INK,4);
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(-8,-60+bob); ctx.lineTo(8,-60+bob); ctx.lineTo(0,-40+bob); ctx.fill();
  circle(0,-82+bob,22,'#ffd6b0',INK,4);
  circle(-7,-84+bob,4.5,'#fff',INK,1.8); circle(7,-84+bob,4.5,'#fff',INK,1.8); circle(-6,-83+bob,2.2,INK,null); circle(8,-83+bob,2.2,INK,null);
  ctx.strokeStyle=INK; ctx.lineWidth=2.5; ctx.beginPath(); ctx.arc(0,-76+bob,5,0.3,Math.PI-0.3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-12,-92+bob); ctx.lineTo(-3,-91+bob); ctx.moveTo(3,-91+bob); ctx.lineTo(12,-92+bob); ctx.stroke();
  ctx.globalAlpha=.35; circle(-13,-77+bob,3.5,'#ff7b7b',null); circle(13,-77+bob,3.5,'#ff7b7b',null); ctx.globalAlpha=1;
  ctx.fillStyle=INK; ctx.beginPath(); ctx.ellipse(0,-102+bob,22,8,0,Math.PI,0); ctx.fill();
  ctx.strokeStyle=INK; ctx.lineWidth=7; ctx.beginPath(); ctx.moveTo(-10,10); ctx.lineTo(-12,40); ctx.moveTo(10,10); ctx.lineTo(12,40); ctx.stroke();
  const bow = Math.sin(t*6+k)*14;
  if (ins==='cello'){
    ctx.beginPath(); ctx.ellipse(28,-10,22,38,0.1,0,7); ctx.fillStyle='#a0522d'; ctx.fill(); ctx.lineWidth=4; ctx.stroke();
    ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(30,-50); ctx.lineTo(26,-90); ctx.stroke();
    ctx.strokeStyle='#ddd'; ctx.beginPath(); ctx.moveTo(-5+bow,-15); ctx.lineTo(60+bow,-5); ctx.stroke();
  } else {
    ctx.save(); ctx.translate(14,-62+bob); ctx.rotate(-0.5);
    ctx.beginPath(); ctx.ellipse(0,0,10,18,0,0,7); ctx.fillStyle='#c0662d'; ctx.fill(); ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.stroke();
    ctx.restore();
    ctx.strokeStyle='#ddd'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(-10+bow,-80+bob); ctx.lineTo(40+bow,-40+bob); ctx.stroke();
  }
  ctx.restore();
}
function carpathia(t, x, y, s){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  smoke(t, 20, -260, 0);
  poly([[-10,-130],[50,-130],[60,-270],[0,-270]], '#d0553a');
  poly([[-2,-240],[58,-240],[60,-270],[0,-270]], INK, INK, 4);
  ctx.strokeStyle=INK; ctx.lineWidth=7; ctx.beginPath(); ctx.moveTo(-230,-70); ctx.lineTo(-220,-300); ctx.moveTo(230,-70); ctx.lineTo(220,-300); ctx.stroke();
  rrect(-180,-130,340,60,6,'#fbf7ee');
  poly([[-280,-70],[290,-80],[250,45],[-230,45]], '#23232e');
  ctx.fillStyle='rgba(255,214,90,.9)'; for (let x=-230;x<240;x+=36){ ctx.beginPath(); ctx.arc(x,-30,6,0,7); ctx.fill(); }
  ctx.font='900 20px "Inter", sans-serif'; ctx.fillStyle='#f5d76e'; ctx.textAlign='left'; ctx.fillText('CARPATHIA', 120, 0);
  ctx.restore();
}
function argo(t, x, y, s){
  ctx.save(); ctx.translate(x, y); ctx.scale(s,s);
  ctx.strokeStyle='#999'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(0,-2000); ctx.lineTo(0,-60); ctx.stroke();
  ctx.globalAlpha = .25; ctx.fillStyle = '#fff6b0';
  ctx.beginPath(); ctx.moveTo(-60,40); ctx.lineTo(-260,700); ctx.lineTo(60,700); ctx.lineTo(-20,40); ctx.fill();
  ctx.beginPath(); ctx.moveTo(60,40); ctx.lineTo(300,700); ctx.lineTo(0,700); ctx.lineTo(20,40); ctx.fill();
  ctx.globalAlpha = 1;
  rrect(-110,-60,220,100,16,'#f1c40f');
  ctx.strokeStyle=INK; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(-110,40); ctx.lineTo(-130,80); ctx.lineTo(130,80); ctx.lineTo(110,40); ctx.stroke();
  circle(-60,40,16,'#fffbe0',INK,5); circle(60,40,16,'#fffbe0',INK,5);
  circle(0,-10,22,'#2d3436',INK,5); circle(6,-14,7,'#74b9ff',null);
  ctx.restore();
}

function daySky(t, horizon=1150, mood='clear'){
  const g = ctx.createLinearGradient(0,0,0,horizon);
  if (mood === 'grey'){ g.addColorStop(0,'#6c7a91'); g.addColorStop(1,'#c9cfd8'); }
  else { g.addColorStop(0,'#4aa3df'); g.addColorStop(1,'#cdeeff'); }
  ctx.fillStyle = g; ctx.fillRect(0,0,W,horizon);
  if (mood !== 'grey') circle(860, 300, 80, '#ffe066', INK, 6);
  for (let i=0;i<3;i++){ const cx = ((i*450 + t*18) % 1400) - 200; cloud(cx, 380+i*140, 1.1); }
}
function submarine(t, x, y, s, flip){
  ctx.save(); ctx.translate(x, y + Math.sin(t*1.2)*6); ctx.scale(flip?-s:s, s);
  ctx.beginPath(); ctx.ellipse(0,0,230,52,0,0,7); ctx.fillStyle='#5d6b5a'; ctx.fill(); ctx.strokeStyle=INK; ctx.lineWidth=LW; ctx.stroke();
  rrect(-40,-100,90,60,14,'#4f5c4c');
  ctx.strokeStyle=INK; ctx.lineWidth=7; ctx.beginPath(); ctx.moveTo(20,-100); ctx.lineTo(20,-170); ctx.lineTo(45,-170); ctx.stroke();
  for (let i=0;i<5;i++) circle(-150+i*60, 0, 9, '#ffd25a', INK, 3);
  ctx.font='900 30px "Inter", sans-serif'; ctx.fillStyle='#e8e8e8'; ctx.textAlign='center'; ctx.fillText('U-20', 5, -60);
  // propeller
  const a = t*12; ctx.strokeStyle=INK; ctx.lineWidth=6;

function waterColumn(x, y, p){

    else drawShip(t, 560, 1290 + down*600, 0.95, {split: split, lit: .6*(1-split)});

      ctx.restore();

    for (let i=0;i<12;i++){ const a=((t*.3+i/12)%1); circle(80+i*85, H - a*H, 6+i%4*4, 'rgba(255,255,255,.25)', 'rgba(255,255,255,.6)', 3); }
    // end card

      const s = easeOutBack(clamp((p-.78)/.1,0,1));
      ctx.save(); ctx.translate(W/2, 600); ctx.scale(s,s);
      rrect(-400,-110,800,220,60,'#e63946');

      ctx.restore();

};
function easeInOut(p){ return ease(p); }

// ---------- HUD: counter + captions ----------
function fmtClock(m){ m = Math.round(m) % 1440; return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); }
function counterHud(sc, p){
  const c = sc.counter; if (!c) return;
  let txt;
  if (c.type === 'text') txt = c.value;
  else if (c.type === 'clock') txt = fmtClock(lerp(c.from, c.to, clamp(p,0,1)));
  else txt = Math.round(lerp(c.from, c.to, ease(clamp(p*1.15,0,1)))).toLocaleString('fr-FR') + (c.suffix||'');
  ctx.font = '900 60px "Inter", sans-serif';
  const w = ctx.measureText(txt).width + 150;
  rrect(W/2 - w/2, 150, w, 110, 55, '#fff8e1', INK, 7);
  // clock icon
  const ix = W/2 - w/2 + 60, iy = 205;
  circle(ix, iy, 30, '#ffd23f', INK, 6);
  const ang = performanceTime*2;
  ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(ix,iy); ctx.lineTo(ix+Math.cos(ang)*20, iy+Math.sin(ang)*20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ix,iy); ctx.lineTo(ix, iy-14); ctx.stroke();
  ctx.fillStyle = INK; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText(txt, ix + 50, 207);
}
function captions(sc, lt){
  const words = sc.show.split(/\s+/);
  const n = words.length;
  // weight words by length for nicer sync
  const wts = words.map(w => w.length + 3); const tot = wts.reduce((a,b)=>a+b,0);
  const usable = sc.speech || sc.dur;
  let acc = 0, cur = 0;
  for (let i=0;i<n;i++){ acc += wts[i]/tot*usable; if (lt < acc){ cur = i; break; } cur = i; }
  const CH = 4;
  const start = Math.floor(cur/CH)*CH;
  const chunk = words.slice(start, start+CH);
  ctx.font = '900 76px "Inter", sans-serif';
  // wrap into max 2 lines
  const lines = []; let line = [];
  for (const w of chunk){ const test = [...line, w].join(' '); if (ctx.measureText(test).width > 920 && line.length){ lines.push(line); line=[w]; } else line.push(w); }
  lines.push(line);
  let idx = start;
  lines.forEach((ln, li) => {
    const y = 1530 + li*96 - (lines.length-1)*48;
    const full = ln.join(' ');
    let x = W/2 - (ctx.measureText(full).width + 16*(ln.length-1))/2;
    for (const w of ln){
      const active = idx === cur;
      const ww = ctx.measureText(w).width;
      ctx.save(); ctx.translate(x + ww/2, y); if (active) ctx.scale(1.12,1.12);
      outlinedText(w, 0, 0, 76, active ? '#ffd23f' : '#ffffff', 'center', 16);
      ctx.restore();
      x += ww + ctx.measureText(' ').width + 16; idx++;
    }
  });
}

let performanceTime = 0;
window.drawFrame = function(t){
  performanceTime = t; PERSON_ID = 0;
  let sc = SCENES[SCENES.length-1];
  for (const s of SCENES){ if (t < s.start + s.dur){ sc = s; break; } }
  SHIP = Object.assign({}, DEFAULT_SHIP, sc.ship || {});
  const lt = t - sc.start, p = clamp(lt / sc.dur, 0, 1);
  ctx.save(); ctx.clearRect(0,0,W,H);
  const z = 1 + 0.06*p; ctx.translate(W/2, H/2); ctx.scale(z, z); ctx.translate(-W/2, -H/2);
  SC[sc.id](t, p);
  ctx.restore();
  counterHud(sc, p);
  captions(sc, lt);
  // fade in/out between scenes
  const f = Math.min(lt, sc.dur - lt);
  if (f < 0.25){ ctx.fillStyle = `rgba(0,0,0,${1 - f/0.25})`; ctx.fillRect(0,0,W,H); }
};
window.grab = () => cv.toDataURL('image/jpeg', 0.9);
</script>
